<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PobreFy - Home</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Circular', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
            padding-bottom: 90px; /* Espaço para o player fixo */
            width: 100vw;
        }

        /* Sidebar Esquerda */
        .sidebar {
            width: 240px;
            min-width: 200px;
            background: #000;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            border-right: 1px solid #282828;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
                min-width: 60px;
                padding: 12px;
            }
            
            .sidebar .logo,
            .sidebar .nav-item span,
            .sidebar h3,
            .sidebar .playlist-link {
                display: none;
            }
            
            .sidebar .nav-item {
                justify-content: center;
                padding: 12px;
            }
        }

        .logo {
            width: 130px;
            margin-bottom: 8px;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px;
            color: #b3b3b3;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.2s;
            font-weight: 700;
            font-size: 14px;
        }

        .nav-item:hover {
            color: #fff;
            background: #1a1a1a;
        }

        .nav-item.active {
            color: #fff;
            background: #1a1a1a;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .playlists-section {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #282828;
            max-height: calc(100vh - 300px);
            overflow-y: auto;
        }

        .playlists-section h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #b3b3b3;
            margin-bottom: 16px;
            padding: 0 12px;
        }

        .playlist-link {
            display: block;
            padding: 8px 12px;
            color: #b3b3b3;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: color 0.2s;
        }

        .playlist-link:hover {
            color: #fff;
        }

        /* Área Principal */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: linear-gradient(180deg, #1e3264 0%, #121212 400px);
            width: 100%;
            min-width: 0;
        }

        .top-bar {
            background: rgba(0, 0, 0, 0.3);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            width: 100%;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .top-bar {
                padding: 12px 16px;
            }
            
            .search-container {
                max-width: 200px;
            }
        }

        .search-container {
            flex: 1;
            max-width: 364px;
            min-width: 200px;
            position: relative;
        }

        @media (max-width: 768px) {
            .search-container {
                max-width: 180px;
                min-width: 120px;
            }
        }

        .search-input {
            width: 100%;
            padding: 12px 40px 12px 16px;
            background: #fff;
            border: none;
            border-radius: 500px;
            font-size: 14px;
            color: #000;
        }

        .search-input::placeholder {
            color: #000;
        }

        .search-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #535353;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .user-avatar:hover {
            transform: scale(1.1);
        }

        /* Conteúdo Principal */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            width: 100%;
            min-width: 0;
        }

        @media (max-width: 768px) {
            .content-area {
                padding: 16px;
            }
        }

        .greeting {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 32px;
        }

        /* Seção de Playlists Rápidas */
        .quick-access {
            margin-bottom: 48px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 24px;
            width: 100%;
        }

        @media (max-width: 1200px) {
            .cards-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 16px;
            }
        }

        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }
        }

        .card {
            background: #181818;
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            background: #282828;
            transform: translateY(-4px);
        }

        .card-image {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            position: relative;
            overflow: hidden;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-button-overlay {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 48px;
            height: 48px;
            background: #1db954;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(8px);
            transition: all 0.3s;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        .card:hover .play-button-overlay {
            opacity: 1;
            transform: translateY(0);
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-subtitle {
            font-size: 14px;
            color: #b3b3b3;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Música Atual */
        .now-playing {
            background: #181818;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .now-playing.hidden {
            display: none;
        }

        .now-playing-image {
            width: 80px;
            height: 80px;
            border-radius: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            flex-shrink: 0;
        }

        .now-playing-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
        }

        .now-playing-info {
            flex: 1;
        }

        .now-playing-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .now-playing-artist {
            font-size: 14px;
            color: #b3b3b3;
        }

        .now-playing-controls {
            display: flex;
            gap: 8px;
        }

        .control-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: #282828;
            transform: scale(1.1);
        }

        .control-btn.play {
            background: #1db954;
            width: 48px;
            height: 48px;
        }

        .control-btn.play:hover {
            background: #1ed760;
            transform: scale(1.1);
        }

        /* Seções de Recomendações */
        .recommendations-section {
            margin-bottom: 48px;
        }

        .horizontal-scroll {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: thin;
            scrollbar-color: #535353 transparent;
            width: 100%;
        }

        @media (max-width: 768px) {
            .horizontal-scroll {
                gap: 12px;
            }
            
            .horizontal-card {
                min-width: 160px;
            }
        }

        .horizontal-scroll::-webkit-scrollbar {
            height: 8px;
        }

        .horizontal-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .horizontal-scroll::-webkit-scrollbar-thumb {
            background: #535353;
            border-radius: 4px;
        }

        .horizontal-card {
            min-width: 200px;
            background: #181818;
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .horizontal-card:hover {
            background: #282828;
        }

        .horizontal-card-image {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }

        .horizontal-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Player Fixo */
        .bottom-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 90px;
            background: #181818;
            border-top: 1px solid #282828;
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 1000;
        }

        .bottom-player.hidden {
            display: none;
        }

        .bottom-player.hidden {
            display: none;
        }

        .player-track-info {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 180px;
            flex: 0 0 30%;
        }

        .player-track-image {
            width: 56px;
            height: 56px;
            border-radius: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            flex-shrink: 0;
        }

        .player-track-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
        }

        .player-track-details {
            min-width: 0;
        }

        .player-track-title {
            font-size: 14px;
            font-weight: 400;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 4px;
        }

        .player-track-artist {
            font-size: 11px;
            color: #b3b3b3;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .player-buttons {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .player-progress {
            width: 100%;
            max-width: 600px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: #535353;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: #fff;
            border-radius: 2px;
            width: 0%;
        }

        .progress-time {
            font-size: 11px;
            color: #b3b3b3;
            min-width: 40px;
            text-align: center;
        }

        .player-volume {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 30%;
            justify-content: flex-end;
        }

        .volume-slider {
            width: 100px;
        }

        /* Scrollbar personalizado */
        .playlists-section::-webkit-scrollbar,
        .content-area::-webkit-scrollbar {
            width: 12px;
        }

        .playlists-section::-webkit-scrollbar-track,
        .content-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .playlists-section::-webkit-scrollbar-thumb,
        .content-area::-webkit-scrollbar-thumb {
            background: #535353;
            border-radius: 6px;
        }

        .playlists-section::-webkit-scrollbar-thumb:hover,
        .content-area::-webkit-scrollbar-thumb:hover {
            background: #727272;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Esquerda -->
        <div class="sidebar">
            <img src="/img/logo.svg" alt="PobreFy" class="logo">
            
            <nav class="nav-menu">
                <a href="/home.html" class="nav-item active" id="homeNav">
                    <svg viewBox="0 0 24 24"><path d="M12.5 3.247a1 1 0 0 0-1 0L4 7.577V20a1 1 0 0 0 1.5.866L12 18.5l6.5 2.366A1 1 0 0 0 20 20V7.577l-7.5-4.33zm-2 1.732a3 3 0 0 1 3 0l7.5 4.33a2 2 0 0 1 1 1.732V20a3 3 0 0 1-3 3h-9a3 3 0 0 1-3-3V11.041a2 2 0 0 1 1-1.732l7.5-4.33z"/></svg>
                    Início
                </a>
                <a href="/explorar.html" class="nav-item" id="searchNav">
                    <svg viewBox="0 0 24 24"><path d="M10.533 1.279c-5.18 0-9.407 4.14-9.407 9.279s4.226 9.279 9.407 9.279c2.234 0 4.29-.77 5.907-2.058l4.353 4.353a1 1 0 1 0 1.414-1.414l-4.344-4.344a9.157 9.157 0 0 0 2.077-5.816c0-5.14-4.226-9.28-9.407-9.28zm-7.407 9.279c0-4.006 3.302-7.28 7.407-7.28s7.407 3.274 7.407 7.28-3.302 7.279-7.407 7.279-7.407-3.273-7.407-7.28z"/></svg>
                    Buscar
                </a>
                <a href="#" class="nav-item" id="libraryNav">
                    <svg viewBox="0 0 24 24"><path d="M3 22a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1h18a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H3zm15.5-2.5a.5.5 0 0 0 .5-.5V4.5a.5.5 0 0 0-.5-.5h-13a.5.5 0 0 0-.5.5v15a.5.5 0 0 0 .5.5h13z"/></svg>
                    Sua Biblioteca
                </a>
            </nav>

            <div class="playlists-section">
                <h3>Playlists</h3>
                <div id="sidebarPlaylists">
                    <div class="playlist-link">Carregando...</div>
                </div>
            </div>
        </div>

        <!-- Área Principal -->
        <div class="main-content">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="O que você quer ouvir?" id="searchInput">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="#000">
                        <path d="M10.533 1.279c-5.18 0-9.407 4.14-9.407 9.279s4.226 9.279 9.407 9.279c2.234 0 4.29-.77 5.907-2.058l4.353 4.353a1 1 0 1 0 1.414-1.414l-4.344-4.344a9.157 9.157 0 0 0 2.077-5.816c0-5.14-4.226-9.28-9.407-9.28zm-7.407 9.279c0-4.006 3.302-7.28 7.407-7.28s7.407 3.274 7.407 7.28-3.302 7.279-7.407 7.279-7.407-3.273-7.407-7.28z"/>
                    </svg>
                </div>
                <div class="user-menu">
                    <div class="user-avatar" id="userAvatar" title="Perfil">J</div>
                </div>
            </div>

            <!-- Conteúdo -->
            <div class="content-area">
                <h1 class="greeting" id="greeting">Boa tarde</h1>

                <!-- Música Atual (se estiver tocando) -->
                <div class="now-playing hidden" id="nowPlaying">
                    <div class="now-playing-image" id="nowPlayingImage">
                        <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 32px;">🎵</div>
                    </div>
                    <div class="now-playing-info">
                        <div class="now-playing-title" id="nowPlayingTitle">Nenhuma música tocando</div>
                        <div class="now-playing-artist" id="nowPlayingArtist">-</div>
                    </div>
                    <div class="now-playing-controls">
                        <button class="control-btn" id="prevBtn">⏮</button>
                        <button class="control-btn play" id="playPauseBtn">▶</button>
                        <button class="control-btn" id="nextBtn">⏭</button>
                    </div>
                </div>

                <!-- Playlists Rápidas -->
                <div class="quick-access">
                    <h2 class="section-title">Feito para você</h2>
                    <div class="cards-grid" id="quickAccessGrid">
                        <div class="card">
                            <div class="card-image">❤️</div>
                            <div class="card-title">Músicas Curtidas</div>
                            <div class="card-subtitle">Suas músicas favoritas</div>
                            <div class="play-button-overlay">▶</div>
                        </div>
                    </div>
                </div>

                <!-- Suas Playlists -->
                <div class="recommendations-section">
                    <h2 class="section-title">Suas Playlists</h2>
                    <div class="horizontal-scroll" id="playlistsScroll">
                        <div style="padding: 20px; color: #b3b3b3;">Carregando playlists...</div>
                    </div>
                </div>

                <!-- Recomendações -->
                <div class="recommendations-section">
                    <h2 class="section-title">Recomendado para você</h2>
                    <div class="horizontal-scroll" id="recommendationsScroll">
                        <div style="padding: 20px; color: #b3b3b3;">Carregando recomendações...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Player Fixo na Parte Inferior -->
    <div class="bottom-player hidden" id="bottomPlayer">
        <div class="player-track-info">
            <div class="player-track-image" id="playerTrackImage">
                <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 24px;">🎵</div>
            </div>
            <div class="player-track-details">
                <div class="player-track-title" id="playerTrackTitle">Nenhuma música</div>
                <div class="player-track-artist" id="playerTrackArtist">-</div>
            </div>
        </div>
        <div class="player-controls">
            <div class="player-buttons">
                <button class="control-btn" id="playerPrevBtn">⏮</button>
                <button class="control-btn play" id="playerPlayPauseBtn">▶</button>
                <button class="control-btn" id="playerNextBtn">⏭</button>
            </div>
            <div class="player-progress">
                <span class="progress-time" id="playerCurrentTime">0:00</span>
                <div class="progress-bar" id="playerProgressBar">
                    <div class="progress-fill" id="playerProgressFill"></div>
                </div>
                <span class="progress-time" id="playerTotalTime">0:00</span>
            </div>
        </div>
        <div class="player-volume">
            <span>🔊</span>
            <input type="range" class="volume-slider" id="playerVolumeSlider" min="0" max="100" value="100">
        </div>
    </div>

    <script src="/js/home.js"></script>
</body>
</html>
