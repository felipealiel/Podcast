<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PobreFy Streaming - Home</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .home-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .welcome {
            text-align: center;
            margin-bottom: 60px;
        }

        .welcome h1 {
            font-size: 48px;
            margin-bottom: 16px;
            color: var(--spotify-green);
        }

        .user-info {
            background: var(--spotify-gray);
            padding: 32px;
            border-radius: 8px;
            margin-bottom: 32px;
        }

        .user-info h2 {
            margin-bottom: 16px;
            color: var(--spotify-green);
        }

        .user-info p {
            margin: 8px 0;
            color: var(--spotify-light-gray);
        }

        .user-info strong {
            color: var(--spotify-white);
        }

        .actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 32px;
        }

        .btn-secondary {
            padding: 12px 32px;
            border: 1px solid var(--spotify-white);
            border-radius: 500px;
            background: transparent;
            color: var(--spotify-white);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: var(--spotify-white);
            color: var(--spotify-black);
        }
    </style>
</head>
<body>
    <div class="home-container">
        <div class="welcome">
            <h1>🎵 Bem-vindo ao PobreFy!</h1>
            <p style="font-size: 18px; color: var(--spotify-light-gray);">
                Sua conta foi criada com sucesso. Aproveite!
            </p>
        </div>

        <div class="user-info" id="userInfo">
            <h2>Informações da Conta</h2>
            <p><strong>Carregando...</strong></p>
        </div>

        <div class="actions">
            <button class="btn-primary" onclick="alert('Explorar músicas em breve!')">
                Explorar Músicas
            </button>
            <button class="btn-primary" onclick="alert('Explorar podcasts em breve!')">
                Explorar Podcasts
            </button>
            <button class="btn-secondary" id="logoutBtn">
                Sair
            </button>
        </div>
    </div>

    <script src="/js/home.js"></script>
</body>
</html>
