<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PobreFy - Explorar Músicas</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .explorar-container {
            width: 100%;
            margin: 0;
            padding: 20px;
            padding-bottom: 120px; /* Espaço para o player fixo */
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
            width: 100%;
        }
        
        .header h1 {
            color: #fff;
            margin: 0;
        }
        
        .search-section {
            background: #1e1e1e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            width: 100%;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .search-box input {
            flex: 1;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 5px;
            background: #2a2a2a;
            color: #fff;
            font-size: 14px;
        }
        
        .search-box button {
            padding: 12px 24px;
            background: #1db954;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .filter-select {
            padding: 8px 12px;
            border: 1px solid #333;
            border-radius: 5px;
            background: #2a2a2a;
            color: #fff;
            font-size: 14px;
        }
        
        .musicas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .musica-card {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        
        .musica-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(29, 185, 84, 0.3);
        }
        
        .musica-card h3 {
            color: #fff;
            margin: 0 0 10px 0;
            font-size: 18px;
        }
        
        .musica-card p {
            color: #ccc;
            margin: 5px 0;
            font-size: 14px;
        }
        
        .musica-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .btn-play {
            flex: 1;
            padding: 10px;
            background: #1db954;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        
        .btn-play.playing {
            background: #ea4335;
        }
        
        .btn-play:hover {
            background: #1ed760;
        }
        
        .btn-play.playing:hover {
            background: #d33b2c;
        }
        
        .btn-favorite {
            padding: 10px 15px;
            background: transparent;
            border: 1px solid #1db954;
            color: #1db954;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-favorite.favoritado {
            border-color: #ea4335;
            color: #ea4335;
        }
        
        .btn-add-playlist {
            padding: 10px 15px;
            background: transparent;
            border: 1px solid #1db954;
            color: #1db954;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-add-playlist:hover {
            background: #1db954;
            color: #fff;
        }
        
        .btn-comments {
            padding: 10px 15px;
            background: transparent;
            border: 1px solid #1db954;
            color: #1db954;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-comments:hover {
            background: #1db954;
            color: #fff;
        }
        
        /* Modal de playlist */
        .playlist-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        
        .modal-content {
            background: #1e1e1e;
            border-radius: 10px;
            padding: 20px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-header h3 {
            color: #fff;
            margin: 0;
        }
        
        .modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
        }
        
        .btn-criar-playlist {
            width: 100%;
            padding: 12px;
            background: #1db954;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .playlists-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .playlist-item {
            padding: 15px;
            background: #2a2a2a;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        
        .playlist-item:hover {
            background: #333;
        }
        
        .playlist-item span:first-child {
            color: #fff;
            font-weight: 500;
        }
        
        .playlist-info {
            color: #ccc;
            font-size: 12px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #ccc;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #ccc;
        }
        
        .empty-state h2 {
            color: #fff;
            margin-bottom: 10px;
        }

        /* Seção de Categorias */
        .categories-section {
            margin-bottom: 48px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 24px;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            width: 100%;
        }

        @media (max-width: 1200px) {
            .categories-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
            }
        }

        @media (max-width: 768px) {
            .categories-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 10px;
            }
            
            .category-card {
                font-size: 20px;
                padding: 16px;
            }
        }

        .category-card {
            aspect-ratio: 1;
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            color: #fff;
            font-weight: 700;
            font-size: 24px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .category-card:hover {
            transform: scale(1.05);
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: translate(30%, -30%);
        }

        /* Cores para cada gênero */
        .category-pop { background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%); }
        .category-rock { background: linear-gradient(135deg, #8b5cf6 0%, #5b21b6 100%); }
        .category-hiphop { background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); }
        .category-rnb { background: linear-gradient(135deg, #ec4899 0%, #be185d 100%); }
        .category-mpb { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .category-sertanejo { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .category-forro { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .category-funk { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); }
        .category-jazz { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); }
        .category-electronic { background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%); }
        .category-country { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); }
        .category-metal { background: linear-gradient(135deg, #1f2937 0%, #111827 100%); }
        .category-reggae { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); }
        .category-blues { background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%); }
        .category-classical { background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%); }

        /* Seção de Músicas */
        .musicas-section {
            margin-top: 32px;
        }

        .musicas-section.hidden,
        .categories-section.hidden {
            display: none;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .back-btn {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: #1a1a1a;
            border-color: #1db954;
        }
        
        /* Player de música fixo */
        .music-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #181818;
            border-top: 1px solid #333;
            padding: 15px 20px;
            display: none;
            z-index: 1000;
        }
        
        .music-player.active {
            display: block;
        }
        
        .player-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .player-info {
            flex: 1;
            min-width: 0;
        }
        
        .player-info h4 {
            color: #fff;
            margin: 0 0 5px 0;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .player-info p {
            color: #ccc;
            margin: 0;
            font-size: 12px;
        }
        
        .player-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 2;
            flex-wrap: wrap;
        }
        
        @media (max-width: 768px) {
            .player-content {
                flex-direction: column;
                gap: 10px;
            }
            
            .player-controls {
                width: 100%;
                justify-content: center;
            }
            
            .progress-container {
                width: 100%;
            }
        }
        
        .player-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #fff;
            color: #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: transform 0.2s;
        }
        
        .player-btn:hover {
            transform: scale(1.1);
        }
        
        .player-btn.play-btn {
            width: 50px;
            height: 50px;
            background: #1db954;
            color: #fff;
        }
        
        .progress-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .progress-time {
            color: #ccc;
            font-size: 12px;
            min-width: 50px;
            text-align: center;
        }
        
        .progress-bar {
            flex: 1;
            height: 4px;
            background: #333;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: #1db954;
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s;
        }
        
        .player-volume {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .volume-slider {
            width: 100px;
        }
    </style>
</head>
<body>
    <!-- Player de música fixo -->
    <div class="music-player" id="musicPlayer">
        <div class="player-content">
            <div class="player-info">
                <h4 id="playerTitle">Nenhuma música selecionada</h4>
                <p id="playerArtist">-</p>
            </div>
            <div class="player-controls">
                <button class="player-btn" id="prevBtn">⏮</button>
                <button class="player-btn play-btn" id="playPauseBtn">▶</button>
                <button class="player-btn" id="nextBtn">⏭</button>
                <div class="progress-container">
                    <span class="progress-time" id="currentTime">0:00</span>
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span class="progress-time" id="totalTime">0:00</span>
                </div>
                <div class="player-volume">
                    <span>🔊</span>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100">
                </div>
            </div>
        </div>
    </div>
    
    <div class="explorar-container">
        <div class="header">
            <h1>🎵 Explorar Músicas</h1>
            <div>
                <a href="/home.html" style="color: #1db954; text-decoration: none; margin-right: 20px;">← Voltar</a>
                <button id="logoutBtn" style="padding: 10px 20px; background: #ea4335; color: #fff; border: none; border-radius: 5px; cursor: pointer;">Sair</button>
            </div>
        </div>
        
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar músicas, artistas, álbuns...">
                <button id="searchBtn">Buscar</button>
            </div>
        </div>

        <!-- Seção de Categorias/Gêneros -->
        <div class="categories-section" id="categoriesSection">
            <h2 class="section-title">Navegar por todas as seções</h2>
            <div class="categories-grid" id="categoriesGrid">
                <!-- Cards de gêneros serão inseridos aqui via JavaScript -->
            </div>
        </div>

        <!-- Seção de Músicas (aparece quando seleciona um gênero) -->
        <div class="musicas-section hidden" id="musicasSection">
            <div class="section-header">
                <button class="back-btn" id="backBtn">← Voltar</button>
                <h2 class="section-title" id="generoTitle">Músicas</h2>
            </div>
            <div class="filters">
                <select id="ordenarFilter" class="filter-select">
                    <option value="relevancia">Relevância</option>
                    <option value="recente">Mais Recentes</option>
                    <option value="reproducoes">Mais Reproduzidas</option>
                    <option value="favoritos">Mais Favoritadas</option>
                </select>
            </div>
            <div id="musicas-container">
                <div class="loading">Carregando músicas...</div>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:3000/api/v1';
        const token = localStorage.getItem('token');
        
        if (!token) {
            window.location.href = '/index.html';
        }
        
        // Player de música global
        let currentAudio = null;
        let currentMusica = null;
        let isPlaying = false;
        
        // Elementos do player
        const musicPlayer = document.getElementById('musicPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playerTitle = document.getElementById('playerTitle');
        const playerArtist = document.getElementById('playerArtist');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const volumeSlider = document.getElementById('volumeSlider');
        
        // Inicializar player
        function initPlayer() {
            // Event listeners do player
            playPauseBtn.addEventListener('click', togglePlayPause);
            progressBar.addEventListener('click', seekTo);
            volumeSlider.addEventListener('input', function() {
                if (currentAudio) {
                    currentAudio.volume = this.value / 100;
                }
            });
            
            // Atualizar progresso enquanto toca
            setInterval(updateProgress, 1000);
        }
        
        // Toggle play/pause
        function togglePlayPause() {
            if (!currentAudio) return;
            
            if (isPlaying) {
                currentAudio.pause();
                playPauseBtn.textContent = '▶';
                isPlaying = false;
            } else {
                currentAudio.play();
                playPauseBtn.textContent = '⏸';
                isPlaying = true;
            }
            // Atualizar botões na lista
            updatePlayButtons();
        }
        
        // Reproduzir música
        function playMusica(musica) {
            // Parar música atual se houver
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            
            currentMusica = musica;
            
            // Criar URL com token na query string para autenticação
            // O elemento Audio não envia headers, então usamos query string
            const audioUrl = `${API_URL}/streaming/stream/${musica._id}?token=${encodeURIComponent(token)}`;
            
            console.log('🎵 [PLAYER] Iniciando reprodução:', musica.titulo);
            
            // Criar novo elemento de áudio
            currentAudio = new Audio(audioUrl);
            currentAudio.volume = volumeSlider.value / 100;
            
            // Event listeners do áudio
            currentAudio.addEventListener('loadedmetadata', function() {
                totalTimeEl.textContent = formatTime(currentAudio.duration);
            });
            
            currentAudio.addEventListener('ended', function() {
                playPauseBtn.textContent = '▶';
                isPlaying = false;
                currentTimeEl.textContent = '0:00';
                progressFill.style.width = '0%';
                updatePlayButtons();
            });
            
            currentAudio.addEventListener('play', function() {
                playPauseBtn.textContent = '⏸';
                isPlaying = true;
                updatePlayButtons();
            });
            
            currentAudio.addEventListener('pause', function() {
                playPauseBtn.textContent = '▶';
                isPlaying = false;
                updatePlayButtons();
            });
            
            // Atualizar informações do player
            playerTitle.textContent = musica.titulo;
            playerArtist.textContent = musica.autor;
            
            // Salvar música atual no sessionStorage para a home page
            sessionStorage.setItem('playingMusica', JSON.stringify({
                _id: musica._id,
                titulo: musica.titulo,
                autor: musica.autor,
                imageUrl: musica.capa?.url || ''
            }));
            
            // Mostrar player
            musicPlayer.classList.add('active');
            
            // Reproduzir
            currentAudio.play().catch(err => {
                console.error('Erro ao reproduzir:', err);
                alert('Erro ao reproduzir música. Verifique se o arquivo existe.');
            });
        }
        
        // Atualizar progresso
        function updateProgress() {
            if (!currentAudio) return;
            
            const current = currentAudio.currentTime;
            const duration = currentAudio.duration || 0;
            
            currentTimeEl.textContent = formatTime(current);
            
            if (duration > 0) {
                const percent = (current / duration) * 100;
                progressFill.style.width = percent + '%';
            }
        }
        
        // Buscar posição na música
        function seekTo(e) {
            if (!currentAudio) return;
            
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            const newTime = percent * currentAudio.duration;
            
            currentAudio.currentTime = newTime;
        }
        
        // Formatar tempo
        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Estado da página
        let currentGenero = null;
        let currentView = 'categories'; // 'categories' ou 'musicas'
        
        // Gêneros disponíveis
        const generos = [
            { nome: 'Pop', classe: 'category-pop', emoji: '🎵' },
            { nome: 'Rock', classe: 'category-rock', emoji: '🎸' },
            { nome: 'Hip Hop', classe: 'category-hiphop', emoji: '🎤' },
            { nome: 'R&B', classe: 'category-rnb', emoji: '🎹' },
            { nome: 'MPB', classe: 'category-mpb', emoji: '🇧🇷' },
            { nome: 'Sertanejo', classe: 'category-sertanejo', emoji: '🤠' },
            { nome: 'Forró', classe: 'category-forro', emoji: '🎉' },
            { nome: 'Funk Carioca', classe: 'category-funk', emoji: '🔥' },
            { nome: 'Jazz', classe: 'category-jazz', emoji: '🎷' },
            { nome: 'Electronic', classe: 'category-electronic', emoji: '⚡' },
            { nome: 'Country', classe: 'category-country', emoji: '🎪' },
            { nome: 'Metal', classe: 'category-metal', emoji: '🤘' },
            { nome: 'Reggae', classe: 'category-reggae', emoji: '🌴' },
            { nome: 'Blues', classe: 'category-blues', emoji: '🎸' },
            { nome: 'Classical', classe: 'category-classical', emoji: '🎻' }
        ];
        
        // Carregar categorias
        function loadCategories() {
            const grid = document.getElementById('categoriesGrid');
            grid.innerHTML = generos.map(genero => `
                <div class="category-card ${genero.classe}" data-genero="${genero.nome}">
                    <div style="font-size: 48px; margin-bottom: 8px;">${genero.emoji}</div>
                    <div>${genero.nome}</div>
                </div>
            `).join('');
            
            // Adicionar event listeners para os cards de categoria
            grid.querySelectorAll('.category-card').forEach(card => {
                card.style.cursor = 'pointer';
                card.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const genero = this.getAttribute('data-genero');
                    console.log('🖱️ Card clicado, gênero:', genero);
                    if (genero) {
                        selecionarGenero(genero);
                    } else {
                        console.error('❌ Gênero não encontrado no card');
                    }
                });
            });
        }
        
        // Selecionar gênero
        function selecionarGenero(genero) {
            console.log('🎵 Selecionando gênero:', genero);
            currentGenero = genero;
            currentView = 'musicas';
            
            // Mostrar seção de músicas e esconder categorias
            const categoriesSection = document.getElementById('categoriesSection');
            const musicasSection = document.getElementById('musicasSection');
            const generoTitle = document.getElementById('generoTitle');
            
            if (categoriesSection) categoriesSection.classList.add('hidden');
            if (musicasSection) musicasSection.classList.remove('hidden');
            if (generoTitle) generoTitle.textContent = genero;
            
            // Buscar músicas do gênero
            buscarPorGenero(genero);
        }
        
        // Mostrar categorias
        function showCategories() {
            currentGenero = null;
            currentView = 'categories';
            
            // Limpar parâmetros da URL
            const url = new URL(window.location);
            url.searchParams.delete('playlist');
            window.history.replaceState({}, '', url);
            
            // Mostrar categorias e esconder músicas
            document.getElementById('categoriesSection').classList.remove('hidden');
            document.getElementById('musicasSection').classList.add('hidden');
        }
        
        // Buscar por gênero
        async function buscarPorGenero(genero) {
            console.log('🔍 Buscando músicas do gênero:', genero);
            const container = document.getElementById('musicas-container');
            if (!container) {
                console.error('❌ Container de músicas não encontrado');
                return;
            }
            
            container.innerHTML = '<div class="loading">Carregando músicas...</div>';
            
            try {
                const ordenar = document.getElementById('ordenarFilter')?.value || 'relevancia';
                // Normalizar o gênero para corresponder ao banco (primeira letra maiúscula, resto minúscula)
                const generoNormalizado = genero.charAt(0).toUpperCase() + genero.slice(1).toLowerCase();
                console.log('📝 Gênero normalizado:', generoNormalizado);
                
                // Primeiro, tentar buscar todas as músicas e filtrar no frontend (mais confiável)
                console.log('🌐 Buscando todas as músicas...');
                const allResponse = await fetch(`${API_URL}/musicas?limit=200`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const allData = await allResponse.json();
                console.log('📦 Resposta recebida:', allData);
                
                if (allResponse.ok && allData.success && allData.data) {
                    // Filtrar por gênero (case insensitive)
                    const musicasFiltradas = allData.data.filter(m => {
                        if (!m.genero) return false;
                        const generoMusica = m.genero.toString().toLowerCase().trim();
                        const generoBuscado = generoNormalizado.toLowerCase().trim();
                        return generoMusica === generoBuscado;
                    });
                    
                    console.log(`✅ Encontradas ${musicasFiltradas.length} músicas do gênero ${generoNormalizado}`);
                    
                    if (musicasFiltradas.length > 0) {
                        displayMusicas(musicasFiltradas);
                    } else {
                        container.innerHTML = 
                            '<div class="empty-state"><h2>Nenhuma música encontrada neste gênero</h2><p>Tente outro gênero</p></div>';
                    }
                } else {
                    // Fallback: tentar busca por API de busca
                    console.log('⚠️ Buscando via API de busca...');
                    const url = `${API_URL}/busca/musicas?genero=${encodeURIComponent(generoNormalizado)}&limit=50&ordenar=${ordenar}`;
                    const response = await fetch(url, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok && data.success) {
                        const musicas = data.data || [];
                        if (musicas.length > 0) {
                            displayMusicas(musicas);
                        } else {
                            container.innerHTML = 
                                '<div class="empty-state"><h2>Nenhuma música encontrada neste gênero</h2><p>Tente outro gênero</p></div>';
                        }
                    } else {
                        container.innerHTML = 
                            '<div class="empty-state"><h2>Nenhuma música encontrada neste gênero</h2><p>Tente outro gênero</p></div>';
                    }
                }
            } catch (error) {
                console.error('❌ Erro ao buscar músicas:', error);
                container.innerHTML = 
                    '<div class="empty-state"><h2>Erro ao buscar músicas</h2><p>' + error.message + '</p></div>';
            }
        }
        
        async function loadMusicas() {
            // Não carregar músicas por padrão, mostrar categorias
            showCategories();
        }
        
        // Verificar se há parâmetro de playlist na URL
        const urlParams = new URLSearchParams(window.location.search);
        const playlistId = urlParams.get('playlist');
        
        // Inicializar
        initPlayer();
        
        if (playlistId) {
            // Se tem playlist na URL, carregar músicas da playlist
            carregarPlaylist(playlistId);
        } else {
            // Senão, carregar categorias por padrão
            loadCategories();
        }
        
        // Função para carregar músicas de uma playlist
        async function carregarPlaylist(playlistId) {
            try {
                const response = await fetch(`${API_URL}/playlists/${playlistId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                
                if (response.ok && data.success && data.data) {
                    const playlist = data.data;
                    const musicas = playlist.musicas || [];
                    
                    // Mostrar seção de músicas
                    document.getElementById('categoriesSection').classList.add('hidden');
                    document.getElementById('musicasSection').classList.remove('hidden');
                    document.getElementById('generoTitle').textContent = playlist.nomePlaylist || 'Playlist';
                    
                    // Converter músicas da playlist para o formato esperado
                    const musicasFormatadas = musicas.map(item => {
                        const musica = item.musicaId || item;
                        return musica;
                    }).filter(m => m); // Remover nulos
                    
                    if (musicasFormatadas.length > 0) {
                        displayMusicas(musicasFormatadas);
                    } else {
                        document.getElementById('musicas-container').innerHTML = 
                            '<div class="empty-state"><h2>Esta playlist está vazia</h2></div>';
                    }
                } else {
                    alert('Erro ao carregar playlist');
                    loadCategories();
                }
            } catch (error) {
                console.error('Erro ao carregar playlist:', error);
                alert('Erro ao carregar playlist');
                loadCategories();
            }
        }
        
        // Event listeners
        document.getElementById('searchBtn').addEventListener('click', buscarMusicas);
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                buscarMusicas();
            }
        });
        document.getElementById('ordenarFilter').addEventListener('change', function() {
            if (currentGenero) {
                buscarPorGenero(currentGenero);
            }
        });
        
        // Botão voltar
        const backBtn = document.getElementById('backBtn');
        if (backBtn) {
            backBtn.addEventListener('click', showCategories);
        }
        document.getElementById('backBtn').addEventListener('click', function() {
            showCategories();
        });
        
        // Logout
        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/index.html';
        });
        
        // Exportar funções para uso global
        // Disponibilizar globalmente (caso necessário)
        window.selecionarGenero = selecionarGenero;
        
        async function buscarMusicas() {
            const query = document.getElementById('searchInput').value.trim();
            
            if (!query) {
                showCategories();
                return;
            }
            
            // Mostrar seção de músicas
            document.getElementById('categoriesSection').classList.add('hidden');
            document.getElementById('musicasSection').classList.remove('hidden');
            document.getElementById('generoTitle').textContent = `Resultados para "${query}"`;
            currentView = 'musicas';
            
            const container = document.getElementById('musicas-container');
            container.innerHTML = '<div class="loading">Buscando...</div>';
            
            try {
                const ordenar = document.getElementById('ordenarFilter').value;
                const url = `${API_URL}/busca/musicas?q=${encodeURIComponent(query)}&limit=50&ordenar=${ordenar}`;
                
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    displayMusicas(data.data || []);
                } else {
                    container.innerHTML = 
                        '<div class="empty-state"><h2>Nenhuma música encontrada</h2><p>Tente fazer uma busca diferente</p></div>';
                }
            } catch (error) {
                console.error('Erro ao buscar:', error);
                container.innerHTML = 
                    '<div class="empty-state"><h2>Erro ao buscar músicas</h2></div>';
            }
        }
        
        // Armazenar lista de músicas atual
        let currentMusicasList = [];
        
        function displayMusicas(musicas) {
            const container = document.getElementById('musicas-container');
            currentMusicasList = musicas; // Salvar lista atual
            
            if (musicas.length === 0) {
                container.innerHTML = '<div class="empty-state"><h2>Nenhuma música encontrada</h2><p>Tente fazer uma busca diferente</p></div>';
                return;
            }
            
            container.innerHTML = '<div class="musicas-grid">' +
                musicas.map(musica => {
                    const isCurrentPlaying = currentMusica && currentMusica._id === musica._id && isPlaying;
                    return `
                    <div class="musica-card">
                        <h3>${musica.titulo}</h3>
                        <p><strong>Artista:</strong> ${musica.autor}</p>
                        <p><strong>Gênero:</strong> ${musica.genero}</p>
                        <p><strong>Ano:</strong> ${musica.ano}</p>
                        ${musica.album ? `<p><strong>Álbum:</strong> ${musica.album}</p>` : ''}
                        <div class="musica-actions">
                            <button class="btn-play ${isCurrentPlaying ? 'playing' : ''}" data-musica-id="${musica._id}">
                                ${isCurrentPlaying ? '⏸ Pausar' : '▶ Reproduzir'}
                            </button>
                            <button class="btn-favorite" data-musica-id="${musica._id}" data-is-favoritada="false">♡</button>
                            <button class="btn-add-playlist" data-musica-id="${musica._id}" title="Adicionar à playlist">➕</button>
                            <button class="btn-comments" data-musica-id="${musica._id}" title="Ver comentários">💬</button>
                        </div>
                        <div class="comentarios-section" id="comentarios-${musica._id}" style="display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #333;">
                            <div class="comentarios-list" id="comentarios-list-${musica._id}"></div>
                            <div class="adicionar-comentario" style="margin-top: 10px;">
                                <textarea id="comentario-text-${musica._id}" placeholder="Escreva um comentário..." style="width: 100%; padding: 8px; border: 1px solid #333; border-radius: 5px; background: #2a2a2a; color: #fff; resize: vertical; min-height: 60px; font-family: inherit;"></textarea>
                                <button class="btn-enviar-comentario" data-musica-id="${musica._id}" style="margin-top: 8px; padding: 8px 16px; background: #1db954; color: #fff; border: none; border-radius: 5px; cursor: pointer;">Enviar</button>
                            </div>
                        </div>
                    </div>
                `;
                }).join('') +
                '</div>';
            
            // Adicionar event listeners
            container.querySelectorAll('.btn-play').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const musicaId = this.getAttribute('data-musica-id');
                    // Encontrar dados da música
                    const musica = musicas.find(m => m._id === musicaId);
                    if (musica) {
                        // Se já está tocando esta música, pausar
                        if (currentMusica && currentMusica._id === musicaId && isPlaying) {
                            togglePlayPause();
                        } else {
                            // Tocar nova música
                            playMusica(musica);
                        }
                        // Atualizar todos os botões
                        updatePlayButtons();
                    }
                });
            });
            
            container.querySelectorAll('.btn-favorite').forEach(async (btn) => {
                const musicaId = btn.getAttribute('data-musica-id');
                // Verificar se já está favoritada
                const isFavoritada = await verificarFavorito(musicaId);
                if (isFavoritada) {
                    btn.textContent = '♥';
                    btn.style.color = '#ea4335';
                    btn.classList.add('favoritado');
                }
                
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleFavorite(musicaId, this);
                });
            });
            
            container.querySelectorAll('.btn-add-playlist').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const musicaId = this.getAttribute('data-musica-id');
                    adicionarAPlaylist(musicaId);
                });
            });
            
            // Event listeners para botões de comentários
            container.querySelectorAll('.btn-comments').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const musicaId = this.getAttribute('data-musica-id');
                    toggleComentarios(musicaId);
                });
            });
            
            // Event listeners para enviar comentários
            container.querySelectorAll('.btn-enviar-comentario').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const musicaId = this.getAttribute('data-musica-id');
                    enviarComentario(musicaId);
                });
            });
        }
        
        // Atualizar estado dos botões de play
        function updatePlayButtons() {
            document.querySelectorAll('.btn-play').forEach(btn => {
                const musicaId = btn.getAttribute('data-musica-id');
                const isCurrent = currentMusica && currentMusica._id === musicaId;
                
                if (isCurrent && isPlaying) {
                    btn.textContent = '⏸ Pausar';
                    btn.classList.add('playing');
                } else {
                    btn.textContent = '▶ Reproduzir';
                    btn.classList.remove('playing');
                }
            });
        }
        
        async function toggleFavorite(musicaId, button) {
            try {
                const response = await fetch(`${API_URL}/favoritos/${musicaId}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    button.textContent = data.data.favoritado ? '♥' : '♡';
                    button.style.color = data.data.favoritado ? '#ea4335' : '#1db954';
                    button.classList.toggle('favoritado', data.data.favoritado);
                } else {
                    alert(data.message || 'Erro ao favoritar música');
                }
            } catch (error) {
                console.error('Erro ao favoritar:', error);
                alert('Erro ao favoritar música. Tente novamente.');
            }
        }
        
        // Verificar se música está favoritada
        async function verificarFavorito(musicaId) {
            try {
                const response = await fetch(`${API_URL}/favoritos/verificar/${musicaId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                return data.success && data.data.isFavoritada;
            } catch (error) {
                console.error('Erro ao verificar favorito:', error);
                return false;
            }
        }
        
        // Adicionar música a playlist
        async function adicionarAPlaylist(musicaId) {
            try {
                // Buscar playlists do usuário
                const response = await fetch(`${API_URL}/playlists/minhas`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                const playlists = data.success ? data.data : [];
                
                // Criar modal para escolher playlist
                const modal = document.createElement('div');
                modal.className = 'playlist-modal';
                modal.innerHTML = `
                    <div class="modal-content">
                        <div class="modal-header">
                            <h3>Adicionar à Playlist</h3>
                            <button class="modal-close">&times;</button>
                        </div>
                        <div class="modal-body">
                            <button class="btn-criar-playlist" id="criarNovaPlaylistBtn">
                                ➕ Criar Nova Playlist
                            </button>
                            <div class="playlists-list" id="playlistsList">
                                ${playlists.length > 0 ? playlists.map(p => `
                                    <div class="playlist-item" data-playlist-id="${p._id}">
                                        <span>${p.nomePlaylist}</span>
                                        <span class="playlist-info">${p.stats?.totalMusicas || 0} músicas</span>
                                    </div>
                                `).join('') : '<p>Nenhuma playlist encontrada</p>'}
                            </div>
                        </div>
                    </div>
                `;
                
                document.body.appendChild(modal);
                
                // Event listeners do modal
                modal.querySelector('.modal-close').addEventListener('click', () => {
                    document.body.removeChild(modal);
                });
                
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        document.body.removeChild(modal);
                    }
                });
                
                // Criar nova playlist
                modal.querySelector('#criarNovaPlaylistBtn').addEventListener('click', async () => {
                    const nome = prompt('Nome da nova playlist:');
                    if (nome && nome.trim()) {
                        try {
                            const createResponse = await fetch(`${API_URL}/playlists`, {
                                method: 'POST',
                                headers: {
                                    'Authorization': `Bearer ${token}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ nomePlaylist: nome.trim() })
                            });
                            
                            const createData = await createResponse.json();
                            if (createResponse.ok && createData.success) {
                                // Adicionar música à nova playlist
                                // O ID pode estar em diferentes lugares dependendo da resposta
                                let playlistId = null;
                                if (createData.data) {
                                    if (typeof createData.data === 'string') {
                                        playlistId = createData.data;
                                    } else if (createData.data._id) {
                                        playlistId = createData.data._id;
                                    } else if (createData.data.insertedId) {
                                        playlistId = createData.data.insertedId;
                                    } else if (createData.data.results) {
                                        // Se for resultado de múltiplos clusters
                                        const firstResult = Object.values(createData.data.results || {})[0];
                                        if (firstResult && firstResult.insertedId) {
                                            playlistId = firstResult.insertedId;
                                        }
                                    }
                                }
                                
                                if (playlistId) {
                                    await adicionarMusicaAPlaylist(playlistId, musicaId);
                                    document.body.removeChild(modal);
                                } else {
                                    alert('Playlist criada, mas não foi possível adicionar a música. Tente adicionar manualmente.');
                                    document.body.removeChild(modal);
                                }
                            } else {
                                alert(createData.message || 'Erro ao criar playlist');
                            }
                        } catch (error) {
                            console.error('Erro ao criar playlist:', error);
                            alert('Erro ao criar playlist');
                        }
                    }
                });
                
                // Adicionar a playlist existente
                modal.querySelectorAll('.playlist-item').forEach(item => {
                    item.addEventListener('click', async () => {
                        const playlistId = item.getAttribute('data-playlist-id');
                        await adicionarMusicaAPlaylist(playlistId, musicaId);
                        document.body.removeChild(modal);
                    });
                });
                
            } catch (error) {
                console.error('Erro ao buscar playlists:', error);
                alert('Erro ao carregar playlists');
            }
        }
        
        // Toggle comentários (mostrar/esconder)
        async function toggleComentarios(musicaId) {
            const comentariosSection = document.getElementById(`comentarios-${musicaId}`);
            if (!comentariosSection) return;
            
            if (comentariosSection.style.display === 'none') {
                comentariosSection.style.display = 'block';
                await carregarComentarios(musicaId);
            } else {
                comentariosSection.style.display = 'none';
            }
        }
        
        // Carregar comentários de uma música
        async function carregarComentarios(musicaId) {
            const comentariosList = document.getElementById(`comentarios-list-${musicaId}`);
            if (!comentariosList) return;
            
            comentariosList.innerHTML = '<div style="color: #b3b3b3; padding: 10px;">Carregando comentários...</div>';
            
            try {
                const response = await fetch(`${API_URL}/musicas/${musicaId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                
                if (response.ok && data.success && data.data) {
                    const musica = data.data;
                    const comentarios = musica.comentarios || [];
                    
                    if (comentarios.length === 0) {
                        comentariosList.innerHTML = '<div style="color: #b3b3b3; padding: 10px;">Nenhum comentário ainda. Seja o primeiro a comentar!</div>';
                    } else {
                        comentariosList.innerHTML = comentarios.map(comentario => {
                            const usuario = comentario.usuarioId || {};
                            const nomeUsuario = usuario.nomeUsuario || 'Usuário';
                            const dataComentario = comentario.dataComentario ? new Date(comentario.dataComentario) : new Date();
                            const dataFormatada = dataComentario.toLocaleDateString('pt-BR', { 
                                day: '2-digit', 
                                month: '2-digit', 
                                year: 'numeric',
                                hour: '2-digit',
                                minute: '2-digit'
                            });
                            
                            return `
                                <div class="comentario-item" style="padding: 10px; margin-bottom: 10px; background: #2a2a2a; border-radius: 5px;">
                                    <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                                        <strong style="color: #1db954;">${nomeUsuario}</strong>
                                        <span style="color: #b3b3b3; font-size: 12px;">${dataFormatada}</span>
                                    </div>
                                    <p style="color: #fff; margin: 0;">${comentario.texto}</p>
                                </div>
                            `;
                        }).join('');
                    }
                } else {
                    comentariosList.innerHTML = '<div style="color: #ea4335; padding: 10px;">Erro ao carregar comentários</div>';
                }
            } catch (error) {
                console.error('Erro ao carregar comentários:', error);
                comentariosList.innerHTML = '<div style="color: #ea4335; padding: 10px;">Erro ao carregar comentários</div>';
            }
        }
        
        // Enviar comentário
        async function enviarComentario(musicaId) {
            const textarea = document.getElementById(`comentario-text-${musicaId}`);
            if (!textarea) return;
            
            const texto = textarea.value.trim();
            
            if (!texto) {
                alert('Por favor, escreva um comentário');
                return;
            }
            
            if (texto.length > 500) {
                alert('Comentário não pode ter mais de 500 caracteres');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/musicas/${musicaId}/comentarios`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ texto })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    textarea.value = '';
                    // Recarregar comentários
                    await carregarComentarios(musicaId);
                } else {
                    alert(data.message || 'Erro ao adicionar comentário');
                }
            } catch (error) {
                console.error('Erro ao enviar comentário:', error);
                alert('Erro ao enviar comentário');
            }
        }
        
        // Adicionar música a uma playlist específica
        async function adicionarMusicaAPlaylist(playlistId, musicaId) {
            try {
                const response = await fetch(`${API_URL}/playlists/${playlistId}/musicas`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ musicaId })
                });
                
                const data = await response.json();
                if (response.ok && data.success) {
                    alert('Música adicionada à playlist com sucesso!');
                } else {
                    alert(data.message || 'Erro ao adicionar música à playlist');
                }
            } catch (error) {
                console.error('Erro ao adicionar música à playlist:', error);
                alert('Erro ao adicionar música à playlist');
            }
        }
    </script>
</body>
