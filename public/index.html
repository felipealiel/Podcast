<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PobreFy Streaming - Entre ou cadastre-se</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <svg viewBox="0 0 63 20" xmlns="http://www.w3.org/2000/svg">
                <path d="M61.04 11.884c-1.84 0-3.2 1.44-3.2 3.36 0 1.96 1.36 3.36 3.2 3.36s3.2-1.4 3.2-3.36c0-1.92-1.36-3.36-3.2-3.36zm0 5.44c-.88 0-1.52-.72-1.52-2.08 0-1.36.64-2.08 1.52-2.08s1.52.72 1.52 2.08c0 1.36-.64 2.08-1.52 2.08zM46.28 12.124h-1.68v6.4h1.68v-3.52c0-.88.52-1.44 1.32-1.44.12 0 .28.04.4.08v-1.56c-.12-.04-.24-.04-.36-.04-1.08 0-1.92.64-2.36 1.72v-1.64zM34.84 11.884c-1.16 0-2.12.44-2.76 1.28v-1.16h-1.68v7.92h1.68v-2.84c.64.84 1.6 1.28 2.76 1.28 1.84 0 3.2-1.4 3.2-3.24 0-1.84-1.36-3.24-3.2-3.24zm-.24 5.2c-.88 0-1.52-.72-1.52-1.96 0-1.24.64-1.96 1.52-1.96s1.52.72 1.52 1.96c0 1.24-.64 1.96-1.52 1.96zM24.44 11.884c-1.16 0-2.12.44-2.76 1.28v-1.16h-1.68v6.4h1.68v-3.52c0-.88.52-1.44 1.32-1.44.12 0 .28.04.4.08v-1.56c-.12-.04-.24-.04-.36-.04-1.08 0-1.92.64-2.36 1.72v-1.64zM15.72 11.884c-1.84 0-3.2 1.44-3.2 3.36 0 1.96 1.36 3.36 3.2 3.36s3.2-1.4 3.2-3.36c0-1.92-1.36-3.36-3.2-3.36zm0 5.44c-.88 0-1.52-.72-1.52-2.08 0-1.36.64-2.08 1.52-2.08s1.52.72 1.52 2.08c0 1.36-.64 2.08-1.52 2.08zM7.6 11.884c-1.84 0-3.16 1.44-3.16 3.36 0 1.92 1.32 3.36 3.16 3.36 1.04 0 1.88-.4 2.48-1.12v.92h1.68v-6.4h-1.68v.92c-.6-.72-1.44-1.04-2.48-1.04zm.24 5.44c-.88 0-1.52-.72-1.52-2.08 0-1.36.64-2.08 1.52-2.08s1.52.72 1.52 2.08c0 1.36-.64 2.08-1.52 2.08z" fill="currentColor"></path>
                <path d="M10 5c-2.76 0-5-2.24-5-5h-5c0 5.52 4.48 10 10 10s10-4.48 10-10h-5c0 2.76-2.24 5-5 5z" fill="#1ED760"></path>
            </svg>
            <h1>Entrar no PobreFy</h1>
        </div>

        <!-- Botões de Login Social -->
        <div class="social-buttons">
            <button class="social-btn google-btn" onclick="alert('Login com Google em breve!')">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continuar com o Google
            </button>

            <button class="social-btn facebook-btn" onclick="alert('Login com Facebook em breve!')">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="#1877F2">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
                Continuar com o Facebook
            </button>

            <button class="social-btn apple-btn" onclick="alert('Login com Apple em breve!')">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                </svg>
                Continuar com a Apple
            </button>

            <button class="social-btn phone-btn" onclick="alert('Login com telefone em breve!')">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                </svg>
                Continuar com um número de telefone
            </button>
        </div>

        <div class="divider">
            <span>OU</span>
        </div>

        <!-- Formulário de Login -->
        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="emailOrUsername">E-mail ou nome de usuário</label>
                <input 
                    type="text" 
                    id="emailOrUsername" 
                    name="emailOrUsername" 
                    placeholder="E-mail ou nome de usuário"
                    required
                >
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input 
                    type="password" 
                    id="senha" 
                    name="senha" 
                    placeholder="Senha"
                    required
                >
            </div>

            <div class="form-options">
                <label class="checkbox-container">
                    <input type="checkbox" id="rememberMe">
                    <span class="checkmark"></span>
                    Lembrar de mim
                </label>
                <a href="#" class="forgot-password">Esqueceu sua senha?</a>
            </div>

            <button type="submit" class="btn-primary">Entrar</button>

            <div class="error-message" id="errorMessage" style="display: none;"></div>
        </form>

        <!-- Link para Cadastro -->
        <div class="signup-link">
            <p>Não tem uma conta? <a href="/cadastro.html">Inscrever-se no PobreFy</a></p>
        </div>
    </div>

    <script src="/js/login.js"></script>
</body>
</html>
