<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1DB954;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1ed760;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="70" cy="70" r="70" fill="url(#grad)"/>
  
  <!-- Musical note - simplified -->
  <g transform="translate(40, 35)">
    <!-- Note head -->
    <ellipse cx="30" cy="35" rx="8" ry="10" fill="white"/>
    <ellipse cx="50" cy="30" rx="8" ry="10" fill="white"/>
    
    <!-- Note stem -->
    <rect x="38" y="10" width="3" height="30" fill="white"/>
    <rect x="58" y="5" width="3" height="30" fill="white"/>
    
    <!-- Note flags -->
    <path d="M 41 10 Q 50 15 55 20 L 52 23 Q 47 18 41 13 Z" fill="white"/>
    <path d="M 61 5 Q 70 10 75 15 L 72 18 Q 67 13 61 8 Z" fill="white"/>
  </g>
  
  <!-- PobreFy text -->
  <text x="70" y="125" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">PobreFy</text>
</svg>
